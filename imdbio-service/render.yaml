services:
  - type: web
    name: cinevood-imdbio
    runtime: python
    plan: starter
    rootDir: imdbio-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: IMDBIO_SERVICE_TOKEN
        generateValue: true
